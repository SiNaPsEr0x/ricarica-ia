      </div></div>
      <div class=c>
      <div class=stp><span class=sub>Target</span><button onclick="adj(-5)">−</button><input id=t type=number inputmode=numeric value=80 min=20 max=100 oninput="editing=1;mark()" onchange="adj(0)"><button onclick="adj(5)">+</button><span class=sub>%</span></div>
      <div id=tn class=sub style="margin-top:8px"></div>
