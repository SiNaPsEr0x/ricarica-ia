      <button id=cpb onclick="cp()">📋 Copia</button><button id=tgb onclick="tg()">▴</button></div>
      <div id=lb></div></div>
      <script>
      var F='ALL',lines=[],LS=null,editing=0,tt=null,n=0;
      var SN={idle:'Libera',waiting:'In attesa',charging:'In carica',pause:'In pausa'};
      var MN={normal:'Normale',paused:'Pausa',solar:'Solare',hybrid:'Ibrido',suspended:'Sospeso',autolimit:'Autolimit'};
      function E(i){return document.getElementById(i)}
      function isMin(){return E('lp').className=='min'}
      function mark(){var v=+E('t').value;var o=LS&&LS.once;var m=o?100:v;
      E('tgt').style.left=m>=100?'calc(100% - 3px)':Math.max(0,m)+'%';
      E('tn').textContent=o?('🔓 100% solo questa volta, poi torna a '+LS.base+'%'):(v>=100?'🔓 100% = nessun limite: la macchina termina da sola':'Si ferma a '+v+'%')}
      function pushT(){clearTimeout(tt);tt=setTimeout(function(){fetch('/api/target',{method:'POST',body:JSON.stringify({target:+E('t').value})}).then(function(){editing=0})},400)}
      function adj(d){var v=(+E('t').value||80)+d;E('t').value=Math.max(20,Math.min(100,v));editing=1;mark();pushT()}
      function act(a){var all=document.querySelectorAll('.row button');for(var i=0;i<all.length;i++)all[i].disabled=true;
      E('msg').textContent=(a=='start'&&+E('t').value<100&&!(LS&&LS.once))?'⏳ Attendo il SoC (max 45 s)...':'...';
      fetch('/api/'+a,{method:'POST',body:JSON.stringify({target:+E('t').value})})
      .then(function(r){return r.json()}).then(function(j){E('msg').textContent=j.msg;editing=0})
      .catch(function(){E('msg').textContent='Errore di rete'})
      .then(function(){for(var i=0;i<all.length;i++)all[i].disabled=false;load();loadLogs()})}
      function once(){var on=!(LS&&LS.once);E('msg').textContent='...';
      fetch('/api/once',{method:'POST',body:JSON.stringify({on:on})})
      .then(function(r){return r.json()}).then(function(j){E('msg').textContent=j.msg;editing=0})
      .catch(function(){E('msg').textContent='Errore di rete'})
      .then(function(){load();loadLogs()})}
      function fw(w){return w==null?'–':(w>=1000?(w/1000).toFixed(2)+' kW':Math.round(w)+' W')}
      function load(){fetch('/api/status').then(function(r){return r.json()}).then(function(s){LS=s;
      if(!editing)E('t').value=s.once?s.base:s.target;
      var v=s.soc!=null?s.soc:s.est;
      if(s.armed&&s.est!=null&&s.src&&s.src!='cloud')v=s.est;
      E('soc').textContent=s.soc==null?'?':Math.round(s.soc)+'%';
      E('fill').style.width=(v==null?0:Math.max(0,Math.min(100,v)))+'%';
      E('sub').textContent='Cloud: '+(s.age==null?'nessun dato':s.age+' s fa')+'  ·  Stima: '+(s.est==null?'–':s.est.toFixed(1)+'%')+'  ·  Fonte: '+(s.src||'–');
      var p=E('pill');
      if(s.acquiring){p.className='pill a';p.textContent='⏳ Attendo il SoC'}
      else if(s.armed){p.className='pill g';p.textContent='🟢 Armato → '+s.target+'%'}
      else if(s.target>=100){p.className='pill f';p.textContent=s.once?'🔓 100% una tantum':'🔓 Senza limite'}
      else{p.className='pill';p.textContent='⚪ Non armato'}
      E('ps').textContent=s.pstate==null?'–':(SN[s.pstate]||s.pstate);
      E('pm').textContent=s.pmode==null?'–':(MN[s.pmode]||s.pmode);
      E('pw').textContent=fw(s.w);
      E('on').textContent=s.once?'↩ Annulla 100%':'🔓 100% solo questa volta';
      document.title=(s.soc==null?'':Math.round(s.soc)+'% · ')+'Ricarica IA';mark()})
      .catch(function(){var p=E('pill');p.className='pill';p.textContent='⚠️ Offline'})}
      function sumTxt(){var s=LS;if(!s)return 'stato n/d';
      return 'SoC cloud '+(s.soc==null?'?':s.soc.toFixed(0)+'%')+' ('+(s.age==null?'-':s.age+'s fa')+') | stima '+(s.est==null?'-':s.est.toFixed(1)+'%')+' | fonte '+(s.src||'-')+' | Prism '+s.pstate+'/'+s.pmode+'/'+(s.w==null?'-':s.w)+'W | armato '+s.armed+' target '+s.target+'% (base '+s.base+'%, una tantum '+s.once+') | attesa SoC '+s.acquiring}
      function vis(){var o=[];for(var i=0;i<lines.length;i++){var l=lines[i];var tag=l.substr(9,4).trim();if(F=='ALL'||tag==F)o.push(l)}return o}
      function render(){var box=E('lb');var nb=box.scrollTop+box.clientHeight>=box.scrollHeight-30;box.textContent='';
      var v=vis();for(var i=0;i<v.length;i++){var l=v[i];var tag=l.substr(9,4).trim();var d=document.createElement('div');var c='';
      if(tag!='MQTT'&&/error|errore|fail|exception|revoked|traceback|non ricevuto|non leggibile|non trovato/i.test(l))c='e';else if(tag!='MQTT'&&/warn|timeout/i.test(l))c='w';
      d.className=c;var sp=document.createElement('span');sp.className='t-'+tag;sp.textContent=l.substr(0,13);d.appendChild(sp);d.appendChild(document.createTextNode(l.substr(13)));box.appendChild(d)}
      if(nb)box.scrollTop=box.scrollHeight}
      function setF(f){F=f;var b=document.querySelectorAll('#lh .tab');for(var i=0;i<b.length;i++){b[i].className='tab'+(b[i].getAttribute('data-f')==f?' on':'')}render()}
      function loadLogs(){fetch('/api/logs').then(function(r){return r.json()}).then(function(j){lines=j;if(!isMin())render()}).catch(function(){})}
      function tg(){var p=E('lp'),m=isMin();p.className=m?'':'min';document.body.className=m?'lo':'';E('tgb').textContent=m?'▾':'▴';if(m){render();loadLogs()}}
      function cp(){var t='LOG stack - '+new Date().toLocaleString()+' - filtro '+F+'\n'+sumTxt()+'\n---\n'+vis().join('\n');
      var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.focus();a.select();
      try{a.setSelectionRange(0,t.length)}catch(e){}
      var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);
      var b=E('cpb');b.textContent=ok?'✅ Copiato':'❌ Errore';setTimeout(function(){b.textContent='📋 Copia'},1500)}
      setInterval(function(){load();n++;if(!isMin()||n%2==0)loadLogs()},3000);load();loadLogs();mark();
      </script>"""

      class H(BaseHTTPRequestHandler):
          def log_message(self, *a):
              pass
          def _send(self, code, body, ctype="application/json"):
              b = body if isinstance(body, bytes) else body.encode()
              self.send_response(code)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(b)))
              self.end_headers()
              self.wfile.write(b)
          def do_GET(self):
              p = self.path.split("?")[0]
              if p == "/api/status":
                  self._send(200, json.dumps(status()))
              elif p == "/api/logs":
                  self._send(200, json.dumps(all_logs()))
              elif p == "/favicon.svg":
                  self._send(200, FAV, "image/svg+xml")
              elif p == "/favicon.ico" or p.startswith("/apple-touch-icon"):
                  self._send(200, icon_png(), "image/png")
              elif p == "/manifest.webmanifest":
                  self._send(200, MANIFEST, "application/manifest+json")
              else:
                  self._send(200, PAGE, "text/html; charset=utf-8")
          def do_POST(self):
              n = int(self.headers.get("Content-Length") or 0)
              try:
                  data = json.loads(self.rfile.read(n) or b"{}")
              except ValueError:
                  data = {}
              try:
                  if self.path == "/api/start":
                      ok, msg = start(int(data.get("target", DEF_TARGET)))
                  elif self.path == "/api/stop":
                      ok, msg = stop()
                  elif self.path == "/api/disarm":
                      ok, msg = disarm()
                  elif self.path == "/api/target":
                      t = set_target(int(data.get("target", DEF_TARGET)))
                      ok, msg = True, "Target " + str(t) + "%"
                  elif self.path == "/api/once":
                      ok, msg = once100(bool(data.get("on")))
                  else:
                      ok, msg = False, "?"
              except (ValueError, TypeError):
                  ok, msg = False, "Valore non valido"
              self._send(200 if ok else 409, json.dumps({"ok": ok, "msg": msg}))

      threading.Thread(target=icon_png, daemon=True).start()
      client.connect_async(BROKER, 1883, 60)
      client.loop_start()
      threading.Thread(target=watcher, daemon=True).start()
      ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
